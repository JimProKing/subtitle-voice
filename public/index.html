<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="극장 한글 자막만 읽어 바로 들려주는 접근성 앱" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="자막소리" />
    <title>자막소리</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-512.jpg" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <a class="skip" href="#main">본문으로 건너뛰기</a>
    <div id="live-polite" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <div id="live-assertive" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

    <div class="shell">
      <header class="topbar">
        <h1>자막소리</h1>
        <p id="status" class="status">대기</p>
        <div class="top-actions">
          <span class="with-help">
            <button type="button" class="icon-btn" id="btn-settings" aria-label="설정">설정</button>
            <button type="button" class="help-btn" data-help="settings" aria-label="설정 설명">?</button>
          </span>
        </div>
      </header>

      <main id="main">
        <section id="home" class="home">
          <p class="home-title">극장 자막을<br />소리로</p>
          <p id="engine-state" class="engine">준비 중</p>
          <div class="shutter-row">
            <span class="with-help">
              <button type="button" class="ghost-sq" id="btn-start-file" aria-label="테스트 영상">영상</button>
              <button type="button" class="help-btn" data-help="file" aria-label="테스트 영상 설명">?</button>
            </span>
            <span class="with-help shutter-wrap">
              <button type="button" class="shutter" id="btn-start-camera" aria-label="시작">시작</button>
              <button type="button" class="help-btn help-btn-on-shutter" data-help="start" aria-label="시작 설명">?</button>
            </span>
            <span class="with-help">
              <button type="button" class="ghost-sq" id="btn-home-voice" aria-label="목소리">목소리</button>
              <button type="button" class="help-btn" data-help="voice" aria-label="목소리 설명">?</button>
            </span>
          </div>
          <input id="file-input" type="file" accept="video/*" hidden />
          <p id="camera-error" class="error" hidden></p>
        </section>

        <section id="stage" class="stage" hidden>
          <div id="preview-wrap" class="viewfinder">
            <video id="camera" autoplay muted playsinline></video>
            <canvas id="overlay" aria-hidden="true"></canvas>
            <div class="sub-frame" id="sub-frame">
              <span>자막을 이 칸에 맞추세요</span>
            </div>
            <button type="button" class="help-btn zone-help" data-help="zone" aria-label="자막 칸 설명">?</button>
          </div>
          <div class="now" aria-hidden="true">
            <p class="now-label">지금 읽는 말</p>
            <p id="now-text">자막을 찾고 있습니다</p>
            <p id="now-meta"></p>
          </div>
          <div class="dock">
            <span class="with-help">
              <button type="button" class="ghost-sq" id="btn-voice" aria-label="목소리">목소리</button>
              <button type="button" class="help-btn" data-help="voice" aria-label="목소리 설명">?</button>
            </span>
            <span class="with-help shutter-wrap">
              <button type="button" class="shutter shutter-stop" id="btn-stop" aria-label="정지">정지</button>
              <button type="button" class="help-btn help-btn-on-shutter" data-help="stop" aria-label="정지 설명">?</button>
            </span>
            <span class="with-help">
              <button type="button" class="ghost-sq" id="btn-speed" aria-label="속도">속도</button>
              <button type="button" class="help-btn" data-help="speed" aria-label="속도 설명">?</button>
            </span>
          </div>
        </section>
      </main>
    </div>

    <dialog id="settings-dialog" class="sheet">
      <form method="dialog" class="sheet-inner">
        <h2>설정</h2>

        <fieldset>
          <legend>
            글자 크기
            <button type="button" class="help-btn" data-help="scale" aria-label="글자 크기 설명">?</button>
          </legend>
          <div class="seg" id="seg-scale">
            <button type="button" data-scale="1">보통</button>
            <button type="button" data-scale="1.15">크게</button>
            <button type="button" data-scale="1.35">더 크게</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>
            읽기 속도
            <button type="button" class="help-btn" data-help="speed" aria-label="속도 설명">?</button>
          </legend>
          <div class="speed-row">
            <button type="button" id="set-speed-down">더 느리게</button>
            <b id="speed-value">1.15</b>
            <button type="button" id="set-speed-up">더 빠르게</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>
            성별
            <button type="button" class="help-btn" data-help="gender" aria-label="성별 설명">?</button>
          </legend>
          <div class="seg" id="seg-gender">
            <button type="button" data-gender="male">남성</button>
            <button type="button" data-gender="neutral">중성</button>
            <button type="button" data-gender="female">여성</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>
            연령
            <button type="button" class="help-btn" data-help="age" aria-label="연령 설명">?</button>
          </legend>
          <div class="seg" id="seg-age">
            <button type="button" data-age="child">아이</button>
            <button type="button" data-age="young">청년</button>
            <button type="button" data-age="middle">중년</button>
            <button type="button" data-age="elder">노년</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>
            사람 · 괴물 · 동물
            <button type="button" class="help-btn" data-help="creature" aria-label="생물 설명">?</button>
          </legend>
          <div class="seg" id="seg-creature">
            <button type="button" data-creature="human">사람</button>
            <button type="button" data-creature="monster">괴물</button>
            <button type="button" data-creature="animal">동물</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>
            자막 위치
            <button type="button" class="help-btn" data-help="region" aria-label="자막 위치 설명">?</button>
          </legend>
          <div class="seg" id="seg-region">
            <button type="button" data-region="bottom">아래, 표준</button>
            <button type="button" data-region="auto">아래 우선</button>
            <button type="button" data-region="top">위만</button>
          </div>
        </fieldset>

        <button type="button" class="primary" id="btn-sample">이 목소리로 들어보기</button>
        <button type="submit" class="ghost" value="close">닫기</button>
      </form>
    </dialog>

    <dialog id="help-dialog" class="sheet help-sheet">
      <form method="dialog" class="sheet-inner">
        <h2>사용법</h2>
        <p id="help-body" class="help-text"></p>
        <button type="submit" class="primary" value="close">닫기</button>
      </form>
    </dialog>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
